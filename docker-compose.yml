services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: abhinayjangde
      MONGO_INITDB_ROOT_PASSWORD: abhinayjangde
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    container_name: chatbhaiya-redis
    profiles: ["local-infra"]
    ports:
      - "6379:6379"
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:latest
    container_name: chatbhaiya-qdrant
    profiles: ["local-infra"]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
volumes:
  mongodb_data:
  qdrant_data:
